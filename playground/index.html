<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH Studio · 设计现场</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./playground.css" />
</head>
<body>
  <div class="pg">
    <header class="pg-top">
      <div class="pg-brand">
        <span class="pg-mark" aria-hidden="true"></span>
        <div>
          <strong>DSH Studio</strong>
          <span>四种结构，两种光线。看 agent 干活的地方长什么样。</span>
        </div>
      </div>
      <div class="pg-top-actions">
        <div class="seg" role="group" aria-label="外观">
          <button type="button" data-appearance="day" class="is-on">日</button>
          <button type="button" data-appearance="dusk">暮</button>
        </div>
        <button type="button" class="pg-ghost" data-action="replay">重播</button>
        <button type="button" class="pg-ghost" data-action="compare" aria-pressed="false">对比</button>
      </div>
    </header>

    <aside class="pg-styles" aria-label="结构"></aside>

    <main class="pg-main">
      <div class="pg-toolbar">
        <div class="pg-scenes" role="group" aria-label="场景">
          <button type="button" class="is-on" data-scene="session">会话</button>
          <button type="button" data-scene="first">首次运行</button>
          <button type="button" data-scene="empty">空工作区</button>
          <button type="button" data-scene="error">失败</button>
        </div>
        <p class="pg-hint"><kbd>1</kbd>–<kbd>4</kbd> 结构 · <kbd>Q W E R</kbd> 场景 · <kbd>D</kbd> 日暮 · <kbd>C</kbd> 对比 · <kbd>Space</kbd> 重播</p>
      </div>
      <div class="pg-windows" data-compare="false">
        <figure class="pg-frame is-focus" data-win="a">
          <figcaption><span class="tick">A</span> <em></em></figcaption>
          <div class="pg-host" id="host-a"></div>
        </figure>
        <figure class="pg-frame" data-win="b" hidden>
          <figcaption><span class="tick">B</span> <em></em></figcaption>
          <div class="pg-host" id="host-b"></div>
        </figure>
      </div>
    </main>

    <aside class="pg-notes" aria-live="polite"></aside>
  </div>

  <script src="./transcript.js"></script>
  <script src="./playground.js"></script>
</body>
</html>
