# The `studio` profile's own patch layer, applied after both bundle layers
# (`@deepseek-ai/dsh-base`, then `@deepseek-ai/dsh-web-app`).
#
# WHAT THIS LAYER IS ALLOWED TO DO
# --------------------------------
# Add two rows and nothing else. The official `ui-*` client roster from
# `dsh-web-app` stays exactly as upstream composed it: every takeover is a
# registration at a lower priority on a slot the official code already
# declared (ARCHITECTURE.md §3), so a Studio run must mount MORE plugins than
# a plain `dsh web` run, never fewer. If you find yourself disabling an
# official row here, the migration went wrong — that is the "silently deleting
# official UI" failure ARCHITECTURE.md §7 forbids.
#
# Verify the composition without booting:
#   npm run studio:dump-config
# and count the rows it prints: the whole web roster plus `studio-surface` and
# `studio-client`.

- insert:
    # ── host half: the surface manifest and the 127.0.0.1 data channel ───────
    #
    # A plain host row (it injects `apiProxy`, which the `api-gateway` row of
    # the web bundle provides). It is inserted after the browser roster so the
    # data channel binds only once the gateway it forwards to exists; the
    # Loader's own dependency resolution is what actually orders activation.
    - id: studio-surface
      name: '@dsh-studio/studio-surface'
      config:
        bridge:
          # bridge-contract.md §2.1: fixed port, loopback only, and the token
          # file the native half reads. `43180` is the default; it is restated
          # here because the native `BridgeDescriptor` defaults to the same
          # number, and a silent divergence between the two is a "runtime
          # offline" screen with no diagnostic.
          port: 43180
          # `shellUrl` is deliberately NOT set here.
          #
          # It used to say `http://127.0.0.1:3080` — the web bundle's *default*
          # port, restated as if it were a fact. Every non-default launch
          # (`--port 3081`, which is what scripts/dogfood.sh does, a `port: 0`
          # composition, or a busy 3080) then published a handshake pointing at
          # a port nobody serves, and the native half loaded a dead URL into its
          # WKWebView: a blank window with no diagnostic, because an address
          # that exists silences both the retry loop and the "runtime offline"
          # screen. Absence would have been strictly better; truth is better
          # still, so `studio-surface` now reads the port off the `webServer`
          # service that owns the socket (packages/studio-surface/src/shell-url.ts).
          #
          # Set it only when a client cannot reach the carrier's own address —
          # a reverse proxy, an SSH tunnel, a container port mapping — because
          # that is the one thing the runtime cannot observe about itself.
        # ── the W1 migration ledger (surface-manifest.md §1) ────────────────
        #
        # Two rows, bottom-up, because rule 7 (§4.7) is bottom-up: a `native`
        # parent never mounts its official React subtree, so the child hole
        # that subtree declared must already belong to Studio before the parent
        # may be taken over. `sidebar.workspaces.directoryFlow` is the leaf, so
        # it comes first — in the file and in the takeover order.
        #
        # Rolling W1 back is one line: set `mode: web` on both rows (or delete
        # them) and the official sidebar renders again, no rebuild, no release
        # (§6).
        surface:
          # The official occupant's directory-picker hole. `retired`, not
          # `native`: the native workspaces view brings its own macOS folder
          # picker, so the official dialog is no longer meaningful here — and
          # `grep -c 'mode: retired'` is exactly the migration ledger
          # (migration-ledger.md).
          sidebar.workspaces.directoryFlow:
            mode: retired
            placement: evacuated
            priority: -1
          # W1's actual target: the workspaces section of the sidebar.
          #
          # `overlay`, NOT `evacuated`, and this single word is the whole W1
          # geometry fix (ARCHITECTURE.md §4.2). `sidebar.workspaces` is a cell
          # *inside* the official sidebar column: the shell owns that column's
          # width, its logo, its footer. `evacuated` means "the Web layout gives
          # this cell no room and the native chrome places the view itself" — so
          # the native view had to be placed by SwiftUI next to the WebView,
          # which is how the first W1 build produced a 150px-tall rail pinned to
          # the window edge while the official UI was pushed a column to the
          # right. `overlay` means the Web side still reserves the very cell the
          # official occupant would have filled and reports it (`slot/rect`);
          # the native view lands exactly there.
          #
          # This row is the authority (known-gaps.md G-4): the host adopts it
          # over its compiled-in `SurfaceManifest.w1Default`, so a divergence
          # here is invisible in Swift tests and fatal at runtime — which is
          # precisely what happened. `contracts/w1-surface-configure.json` is
          # the shared bytes, and `packages/studio-surface/tests/config.test.ts`
          # now reads *this file* and compares it against them.
          sidebar.workspaces:
            mode: native
            placement: overlay
            priority: -1

    # ── browser half: the client plugin the shell fetches ────────────────────
    #
    # A `dsh.client` row: its node half is an empty `apply` (the row exists so
    # `dsh-client-modules` scans it into `window.__DSH_BOOT__` and serves
    # `/plugins/studio-client/client.js`), and its browser half installs the
    # native-slot proxies over the official `ui-slots` priority seam.
    #
    # Outside the Studio WKWebView it stays inert on purpose (ADR-0004): open
    # the same URL in Safari and the official UI renders untouched, which is
    # what makes this row safe to leave mounted.
    - id: studio-client
      name: '@dsh-studio/studio-client'
      config:
        # Bridge diagnostics in the browser console. On during dogfood: the
        # first question of every W1 session is "did the handshake happen",
        # and it must be answerable from the console, not guessed. Payloads
        # are never logged (bridge-contract.md §5).
        diagnostics: true
